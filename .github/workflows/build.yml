name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Download Correct 64-bit Proot Binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd app/src/main/jniLibs/arm64-v8a
          
          curl -fSL -o proot.deb "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107.92_aarch64.deb"
          curl -fSL -o talloc.deb "https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.4.3_aarch64.deb"
          
          ar x proot.deb
          ar x talloc.deb
          tar -xf data.tar.xz
          
          cp data/data/com.termux/files/usr/bin/proot libproot.so
          cp data/data/com.termux/files/usr/lib/libtalloc.so.2 libtalloc.so
          
          if [ -f data/data/com.termux/files/usr/libexec/proot/libproot-loader.so ]; then
            cp data/data/com.termux/files/usr/libexec/proot/libproot-loader.so libproot-loader.so
          else
            cp data/data/com.termux/files/usr/lib/libproot-loader.so libproot-loader.so 2>/dev/null || touch libproot-loader.so
          fi
          
          rm -rf data *.tar.xz *.deb

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SDSTerminal-debug
          path: app/build/outputs/apk/debug/*.apk