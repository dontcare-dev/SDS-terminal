name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Download and Extract Proot Binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd app/src/main/jniLibs/arm64-v8a

          PROOT_DEB=$(curl -s https://packages.termux.dev/apt/termux-main/pool/main/p/proot/ | grep -o 'proot_[^"]*_aarch64.deb' | head -n 1)
          TALLOC_DEB=$(curl -s https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/ | grep -o 'libtalloc_[^"]*_aarch64.deb' | head -n 1)
          SHMEM_DEB=$(curl -s https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/ | grep -o 'libandroid-shmem_[^"]*_aarch64.deb' | head -n 1)

          echo "Downloading $PROOT_DEB, $TALLOC_DEB, and $SHMEM_DEB..."
          curl -fSL -o proot.deb "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/$PROOT_DEB" || true
          curl -fSL -o talloc.deb "https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/$TALLOC_DEB" || true
          curl -fSL -o shmem.deb "https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/$SHMEM_DEB" || true

          # Extract Proot
          mkdir -p proot_extract && cd proot_extract
          ar x ../proot.deb || true
          tar -xf data.tar.* 2>/dev/null || true
          PROOT_BIN=$(find . -name "proot" -type f | head -n 1)
          LOADER_BIN=$(find . -name "*proot-loader*" -type f | head -n 1)
          if [ -n "$PROOT_BIN" ]; then cp "$PROOT_BIN" ../libproot.so; else touch ../libproot.so; fi
          if [ -n "$LOADER_BIN" ]; then cp "$LOADER_BIN" ../libproot-loader.so; else touch ../libproot-loader.so; fi
          cd ..

          # Extract Talloc
          mkdir -p talloc_extract && cd talloc_extract
          ar x ../talloc.deb || true
          tar -xf data.tar.* 2>/dev/null || true
          TALLOC_LIB=$(find . -name "libtalloc.so*" -type f | head -n 1)
          if [ -n "$TALLOC_LIB" ]; then cp "$TALLOC_LIB" ../libtalloc.so; else touch ../libtalloc.so; fi
          cd ..

          # Extract Shmem
          mkdir -p shmem_extract && cd shmem_extract
          ar x ../shmem.deb || true
          tar -xf data.tar.* 2>/dev/null || true
          SHMEM_LIB=$(find . -name "libandroid-shmem.so*" -type f | head -n 1)
          if [ -n "$SHMEM_LIB" ]; then cp "$SHMEM_LIB" ../libandroid-shmem.so; else touch ../libandroid-shmem.so; fi
          cd ..

          chmod +x libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so || true
          rm -rf proot.deb talloc.deb shmem.deb proot_extract talloc_extract shmem_extract

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SDSTerminal-debug
          path: app/build/outputs/apk/debug/*.apk