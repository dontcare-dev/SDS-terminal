name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Download and Extract Proot Binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd app/src/main/jniLibs/arm64-v8a

          PROOT_DEB=$(curl -s https://packages.termux.dev/apt/termux-main/pool/main/p/proot/ | grep -o 'proot_[^"]*_aarch64.deb' | head -n 1)
          TALLOC_DEB=$(curl -s https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/ | grep -o 'libtalloc_[^"]*_aarch64.deb' | head -n 1)
          SHMEM_DEB=$(curl -s https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/ | grep -o 'libandroid-shmem_[^"]*_aarch64.deb' | head -n 1)

          echo "Downloading $PROOT_DEB, $TALLOC_DEB, and $SHMEM_DEB..."
          curl -fSL -o proot.deb "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/$PROOT_DEB"
          curl -fSL -o talloc.deb "https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/$TALLOC_DEB"
          curl -fSL -o shmem.deb "https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/$SHMEM_DEB"

          mkdir -p proot_extract && cd proot_extract
          ar x ../proot.deb
          tar -xf data.tar.* --no-same-owner
          cp data/data/com.termux/files/usr/bin/proot ../libproot.so
          cp data/data/com.termux/files/usr/libexec/proot/loader ../libproot-loader.so
          cd ..

          mkdir -p talloc_extract && cd talloc_extract
          ar x ../talloc.deb
          tar -xf data.tar.* --no-same-owner
          TALLOC_LIB=$(find . -name "libtalloc.so*" -type f | head -n 1)
          cp "$TALLOC_LIB" ../libtalloc.so
          cd ..

          mkdir -p shmem_extract && cd shmem_extract
          ar x ../shmem.deb
          tar -xf data.tar.* --no-same-owner
          SHMEM_LIB=$(find . -name "libandroid-shmem.so*" -type f | head -n 1)
          cp "$SHMEM_LIB" ../libandroid-shmem.so
          cd ..

          if [ ! -s libproot-loader.so ]; then
            echo "ERROR: libproot-loader.so is empty or missing."
            exit 1
          fi

          chmod +x libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so
          rm -rf proot.deb talloc.deb shmem.deb proot_extract talloc_extract shmem_extract

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SDSTerminal-debug
          path: app/build/outputs/apk/debug/*.apk