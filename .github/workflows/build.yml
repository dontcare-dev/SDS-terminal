name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Download Proot Binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd app/src/main/jniLibs/arm64-v8a
          
          # Download from a reliable mirror using the exact current version
          curl -L -o proot.deb https://mirror.bouwhuis.network/termux/apt/apt/apt/termux-main/pool/main/p/proot/proot_5.1.107.98_aarch64.deb
          curl -L -o talloc.deb https://mirror.bouwhuis.network/termux/apt/apt/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.4.3_aarch64.deb
          
          # Extract the .deb archives
          ar x proot.deb
          ar x talloc.deb
          tar -xf data.tar.xz
          
          # Copy the binaries to the correct Android JNI folder names
          cp data/data/com.termux/files/usr/bin/proot libproot.so
          cp data/data/com.termux/files/usr/lib/libtalloc.so.2 libtalloc.so
          
          # The loader is sometimes in libexec, sometimes bundled. Find it.
          if [ -f data/data/com.termux/files/usr/libexec/proot/libproot-loader.so ]; then
            cp data/data/com.termux/files/usr/libexec/proot/libproot-loader.so libproot-loader.so
          else
            # Fallback for bundled loader
            cp data/data/com.termux/files/usr/lib/libproot-loader.so libproot-loader.so 2>/dev/null || touch libproot-loader.so
          fi
          
          # Cleanup
          rm -rf data *.tar.xz *.deb

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SDSTerminal-debug
          path: app/build/outputs/apk/debug/*.apk