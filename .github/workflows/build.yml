name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Download Static Proot Binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd app/src/main/jniLibs/arm64-v8a
          
          # Download statically linked binaries (no libtalloc required)
          curl -L -o libproot.so https://raw.githubusercontent.com/ZhymabekRoman/proot-static/main/bin/proot
          curl -L -o libproot-loader.so https://raw.githubusercontent.com/ZhymabekRoman/proot-static/main/bin/loader
          
          # Make them executable
          chmod +x libproot.so libproot-loader.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SDSTerminal-debug
          path: app/build/outputs/apk/debug/*.apk