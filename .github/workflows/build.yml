name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Download Proot Binaries from Pinned GitHub Archive
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd app/src/main/jniLibs/arm64-v8a
          
          # Download a known-good archive hosted on GitHub
          curl -L -o proot.tar.xz https://github.com/chevey339/kelivo/raw/master/dependencies/termux/proot-5.1.107.92.tar.xz
          
          # Extract the archive
          tar -xf proot.tar.xz
          
          # The archive contains arm64-v8a/ with the exact files we need
          cp arm64-v8a/libproot_exec.so libproot.so
          cp arm64-v8a/libproot_loader.so libproot-loader.so
          cp arm64-v8a/libtalloc.so libtalloc.so
          
          # Cleanup
          rm -rf arm64-v8a proot.tar.xz

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SDSTerminal-debug
          path: app/build/outputs/apk/debug/*.apk